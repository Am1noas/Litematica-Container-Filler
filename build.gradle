plugins {
    id 'fabric-loom' version '1.15-SNAPSHOT'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

repositories {
    flatDir {
        dirs 'libs'
    }
    maven { url "https://bmclapi2.bangbang93.com/maven" }
    maven { url "https://maven.aliyun.com/repository/public" }
    maven { url "https://maven.fabricmc.net/" }
    maven { url "https://masa.dy.fi/maven/" }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    modImplementation name: 'litematica-fabric-1.21.8-0.23.6'
    modImplementation name: 'malilib-fabric-1.21.8-0.25.7'
    modCompileOnly name: 'modmenu-15.0.1'
    modLocalRuntime name: 'modmenu-15.0.1'
    modCompileOnly name: 'quickshulker-2.7.2-1.21.8'
    modLocalRuntime name: 'quickshulker-2.7.2-1.21.8'
}